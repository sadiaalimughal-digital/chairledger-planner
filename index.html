/* ============ CHAIR & LEDGER — barber shop planner ============ */
:root{
  --bg:#F3ECDF; --paper:#FFFBF4; --paper2:#FAF4E9; --ink:#1F1B17; --muted:#6E6457; --line:#E3D7C3; --line2:#EFE6D6;
  --side:#1D1B19; --side2:#2A2723; --sideInk:#EFE6D6; --sideMuted:#A89C89;
  --accent:#B23A2E; --accent2:#2C4A7A; --brass:#B8893B; --brassSoft:#E9D7B3;
  --ok:#3F7D4E; --warn:#C27C14; --bad:#B23A2E; --onAccent:#fff;
  --shadow:0 1px 2px rgba(40,30,15,.06),0 6px 18px rgba(40,30,15,.06);
  --r:14px; --serif:'Lora',Georgia,'Times New Roman',serif; --sans:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
body.t-brass{--accent:#A8792F;--accent2:#2F5D62;--brass:#C79A4A;--side:#0F1A1F;--side2:#182830;--bg:#EEEAE2;--paper2:#F6F2EA}
body.t-sage{--accent:#4F7A5A;--accent2:#A66E3A;--brass:#B08A45;--side:#1F2B25;--side2:#2A3A31;--bg:#ECEEE5;--paper:#FCFCF7;--paper2:#F4F5EE;--line:#D9DECF;--line2:#E8EBE0}
body.t-oxblood{--accent:#7A2229;--accent2:#A87B45;--brass:#A87B45;--side:#26160F;--side2:#3A2219;--bg:#F1E7DE;--line:#E3D2C2}
body.t-steel{--accent:#2E5C8A;--accent2:#B0473A;--brass:#8E9AA8;--brassSoft:#D8DEE5;--side:#161E28;--side2:#212C3A;--bg:#E9EDF1;--paper:#FCFDFE;--paper2:#F3F5F8;--line:#D5DCE4;--line2:#E6EAF0}
body.t-mono{--accent:#1E1E1E;--accent2:#7A7A7A;--brass:#8C8C8C;--brassSoft:#E2E2E2;--side:#111;--side2:#222;--bg:#F1F1EF;--paper:#FFF;--paper2:#F7F7F5;--line:#DDDDDA;--line2:#EAEAE7}
body.dark{--bg:#14120F;--paper:#1E1B17;--paper2:#25221D;--ink:#F1E9DC;--muted:#A69B89;--line:#36312A;--line2:#2C2823;--side:#0D0C0A;--side2:#1A1815;--brassSoft:#4A3C24;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25)}
body.dark.t-mono{--accent:#E8E4DC;--onAccent:#111}
body.dark.t-oxblood{--accent:#B8434B}
body.dark.t-steel{--accent:#5B8CC0;--brassSoft:#2B3A4D}
body.dark.t-sage{--accent:#6FA07B}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--bg);line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:600}
a{color:var(--accent)}
.serif{font-family:var(--serif)}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)} .small{font-size:12px} .tiny{font-size:11px}
.hide{display:none!important}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh;background:linear-gradient(90deg,var(--side) 250px,transparent 250px)}
.side{background:var(--side);color:var(--sideInk);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;scrollbar-width:thin;scrollbar-color:#444 transparent}
.brand{display:flex;gap:12px;align-items:center;padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.07)}
.pole{width:20px;height:58px;border-radius:10px;position:relative;flex:none;background:#eee;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25),0 0 0 3px var(--brass)}
.pole::before{content:"";position:absolute;inset:-40px 0 0 0;background:repeating-linear-gradient(-45deg,#C8352B 0 7px,#fff 7px 14px,#2C4A9A 14px 21px,#fff 21px 28px);animation:pole 2.2s linear infinite}
.pole::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.25),rgba(255,255,255,.35) 40%,rgba(0,0,0,.2));}
.pole.big{width:30px;height:110px;border-radius:15px}
@keyframes pole{to{transform:translateY(39.6px)}}
@media (prefers-reduced-motion:reduce){.pole::before,.radar .sweep{animation:none!important}}
.brand-name{font-family:var(--serif);font-style:italic;font-weight:600;font-size:21px;line-height:1.1;color:#fff}
.brand-sub{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--brass);margin-top:4px;font-weight:600}
.nav{padding:8px 10px 20px;flex:1}
.nav-group{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--sideMuted);padding:12px 10px 4px;font-weight:600;display:flex;align-items:center;gap:8px}
.nav-group::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.08)}
.nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;color:var(--sideInk);padding:6px 10px;border-radius:9px;cursor:pointer;font-size:13.5px;text-align:left;opacity:.86}
.nav button:hover{background:var(--side2);opacity:1}
.nav button.on{background:var(--side2);opacity:1;box-shadow:inset 3px 0 0 var(--brass)}
.nav button svg{width:17px;height:17px;flex:none;stroke:currentColor;opacity:.85}
.nav .badge{margin-left:auto;background:var(--accent);color:var(--onAccent);font-size:10.5px;border-radius:20px;padding:0 7px;font-weight:600;line-height:18px}
.side-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.07);font-size:11px;color:var(--sideMuted)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:14px 28px}
.top h1{font-family:var(--serif);font-size:25px;font-weight:600;letter-spacing:-.01em}
.top .sub{font-size:12px;color:var(--muted);margin-top:1px}
.top .grow{flex:1}
.search{flex:none;white-space:nowrap;display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:7px 12px;width:240px;cursor:text;color:var(--muted);font-size:13px}
.search kbd{margin-left:auto;font-family:var(--sans);font-size:10.5px;border:1px solid var(--line);border-radius:5px;padding:0 5px;background:var(--paper2)}
.content{padding:24px 28px 60px;max-width:1720px;width:100%}

/* ---------- elements ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--paper);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap;transition:transform .08s,background .15s}
.btn:hover{background:var(--paper2)} .btn:active{transform:translateY(1px)}
.btn svg{width:15px;height:15px;stroke:currentColor}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.dark{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--line2)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.xs{padding:2px 8px;font-size:11.5px;border-radius:7px}
.btn.danger{color:var(--bad)}
.btn.icon{padding:7px;width:34px;justify-content:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)} .g-1-2{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;min-width:0}
.card.flat{box-shadow:none}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.label{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
.label::before{content:"";width:14px;height:2px;background:var(--brass);display:inline-block}
.card h3{font-family:var(--serif);font-size:18px}
.stat{position:relative;overflow:hidden}
.stat .v{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.1;margin-top:6px;letter-spacing:-.01em}
.stat .d{font-size:12px;color:var(--muted);margin-top:2px}
.stat::after{content:"";position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;border:10px solid var(--brassSoft);opacity:.55}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:2px 9px;border-radius:20px;background:var(--line2);color:var(--ink);white-space:nowrap}
.chip.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.chip.warn{background:color-mix(in srgb,var(--warn) 17%,transparent);color:var(--warn)}
.chip.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.chip.acc{background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent)}
.chip.blue{background:color-mix(in srgb,var(--accent2) 15%,transparent);color:var(--accent2)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.empty{padding:26px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:12px;font-size:13px}
.divider{height:1px;background:var(--line);margin:14px 0}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],input[type=tel],input[type=search],select,textarea{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:8px 10px;outline:none;font-size:13.5px}
body.dark input,body.dark select,body.dark textarea{background:var(--paper2);color-scheme:dark}
input:focus,select:focus,textarea:focus{border-color:var(--brass);box-shadow:0 0 0 3px color-mix(in srgb,var(--brass) 22%,transparent)}
textarea{min-height:70px;resize:vertical}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f > span{font-size:12px;font-weight:500;color:var(--muted)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form .full{grid-column:1/-1}
.check{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px}
.check input{width:17px;height:17px;accent-color:var(--accent)}
.seg{display:inline-flex;background:var(--line2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1.5px solid var(--line)}
.t td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tr.click{cursor:pointer} .t tr.click:hover td{background:var(--paper2)}
.t .num{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line2);border-radius:8px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:8px}
.prog-ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--line2) 0);display:grid;place-items:center;flex:none}
.prog-ring > span{width:48px;height:48px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-weight:600;font-size:13px}
.list-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2)}
.list-item:last-child{border-bottom:0}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;color:#fff;flex:none;font-family:var(--serif)}
.kbd{font-family:var(--mono);font-size:11px}

/* ---------- signage / unique ---------- */
.sign{position:relative;border-radius:18px;padding:24px 28px;background:var(--side);color:#fff;overflow:hidden;display:flex;gap:24px;align-items:center;box-shadow:var(--shadow)}
.sign::before{content:"";position:absolute;inset:8px;border:1.5px solid color-mix(in srgb,var(--brass) 60%,transparent);border-radius:12px;pointer-events:none}
.sign .hello{font-family:var(--serif);font-style:italic;font-size:30px;font-weight:600}
.sign .date{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--brass);font-weight:600;margin-bottom:4px}
.sign .quote{font-size:13px;color:#d9cdb9;margin-top:6px;max-width:560px}
.open-sign{margin-left:auto;font-family:var(--sans);font-weight:700;letter-spacing:.18em;font-size:22px;padding:8px 18px;border-radius:10px;border:2px solid currentColor;flex:none}
.open-sign.on{color:#ff6b5a;text-shadow:0 0 6px #ff3b2a,0 0 18px #ff3b2a;box-shadow:0 0 14px rgba(255,70,50,.45),inset 0 0 12px rgba(255,70,50,.3)}
.open-sign.off{color:#7d7468}
.stripe{height:6px;border-radius:6px;background:repeating-linear-gradient(-45deg,#C8352B 0 8px,#fff 8px 16px,#2C4A9A 16px 24px,#fff 24px 32px);opacity:.9}

/* tickets */
.ticket{position:relative;background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--bc,#999);border-radius:10px;padding:8px 12px 8px 12px;cursor:pointer}
.ticket:hover{box-shadow:0 4px 14px rgba(0,0,0,.08)}
.ticket::before,.ticket::after{content:"";position:absolute;right:58px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.ticket::before{top:-7px} .ticket::after{bottom:-7px}
.ticket .tt{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.ticket .tn{font-weight:600;font-size:13.5px}
.ticket .stub{position:absolute;right:0;top:0;bottom:0;width:64px;border-left:1.5px dashed var(--line);display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:15px}

/* day book */
.book{display:grid;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);overflow:hidden;box-shadow:var(--shadow)}
.book-head{display:contents}
.book-hcell{padding:10px 12px;border-bottom:1.5px solid var(--line);border-left:1px solid var(--line2);background:var(--paper2);display:flex;align-items:center;gap:9px;position:sticky;top:0;min-width:0}
.book-hcell:first-child{border-left:0}
.book-times{position:relative;border-right:1px solid var(--line2)}
.book-time{position:absolute;left:0;right:6px;text-align:right;font-family:var(--mono);font-size:10.5px;color:var(--muted);transform:translateY(-7px)}
.book-col{position:relative;border-left:1px solid var(--line2);cursor:copy;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--rh)*4 - 1px),var(--line2) calc(var(--rh)*4 - 1px),var(--line2) calc(var(--rh)*4))}
.book-col.off{background-color:color-mix(in srgb,var(--line2) 60%,transparent);cursor:not-allowed}
.book-off{position:absolute;left:0;right:0;background:repeating-linear-gradient(45deg,transparent 0 8px,color-mix(in srgb,var(--line) 55%,transparent) 8px 10px);pointer-events:none}
.book-off.label-off{display:grid;place-items:center;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600}
.appt{position:absolute;left:4px;right:4px;border-radius:8px;padding:4px 8px;overflow:hidden;cursor:pointer;border:1px solid color-mix(in srgb,var(--bc) 40%,transparent);background:color-mix(in srgb,var(--bc) 14%,var(--paper));border-left:4px solid var(--bc);font-size:12px;line-height:1.3;z-index:2}
.appt:hover{z-index:5;box-shadow:0 6px 16px rgba(0,0,0,.14)}
.appt b{font-weight:600}
.appt .at{font-family:var(--mono);font-size:10.5px;opacity:.75}
.appt .as{opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt.done{opacity:.62}
.appt.done,.appt.inchair,.appt.arrived{padding-right:62px}
.appt .one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt.done::after{content:"✓ PAID";position:absolute;right:6px;top:4px;font-size:9.5px;font-weight:700;letter-spacing:.1em;color:var(--ok)}
.appt.noshow{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--bad) 10%,var(--paper)) 0 6px,var(--paper) 6px 12px);border-left-color:var(--bad)}
.appt.cancelled{opacity:.4;text-decoration:line-through}
.appt.inchair{box-shadow:0 0 0 2px var(--bc),0 6px 16px rgba(0,0,0,.12)}
.appt.inchair::after{content:"IN CHAIR";position:absolute;right:6px;top:4px;font-size:9.5px;font-weight:700;letter-spacing:.1em;color:var(--bc)}
.appt.arrived::after{content:"ARRIVED";position:absolute;right:6px;top:4px;font-size:9.5px;font-weight:700;letter-spacing:.1em;color:var(--accent2)}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--accent);z-index:4;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.wday{background:var(--paper);border:1px solid var(--line);border-radius:12px;min-height:420px;display:flex;flex-direction:column;overflow:hidden}
.wday.today{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.wday-h{padding:10px 10px 8px;border-bottom:1px solid var(--line2);cursor:pointer;background:var(--paper2)}
.wday-h .n{font-family:var(--serif);font-size:22px;font-weight:600;line-height:1}
.wday-b{padding:8px;display:flex;flex-direction:column;gap:5px;flex:1}
.wappt{border-left:3px solid var(--bc);background:color-mix(in srgb,var(--bc) 10%,var(--paper));border-radius:6px;padding:4px 7px;font-size:11.5px;cursor:pointer;line-height:1.3}
.wappt.done{opacity:.6} .wappt.cancelled{opacity:.35;text-decoration:line-through} .wappt.noshow{border-left-color:var(--bad)}

/* queue */
.qcard{display:flex;align-items:center;gap:16px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--paper);margin-bottom:10px}
.qnum{font-family:var(--serif);font-size:34px;font-weight:600;width:54px;height:54px;border-radius:12px;display:grid;place-items:center;background:var(--side);color:var(--brass);flex:none}
.chair{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--paper2);display:flex;gap:12px;align-items:center}
.chair-ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.chair-ico svg{width:24px;height:24px;stroke:#fff}

/* lobby */
.lobby{position:fixed;inset:0;z-index:200;background:radial-gradient(circle at 20% 0%,#2a2620,#0e0d0b 70%);color:#F3EBDD;display:flex;flex-direction:column;padding:34px 48px;overflow:hidden}
.lobby::before{content:"";position:absolute;inset:16px;border:2px solid rgba(199,154,74,.45);border-radius:22px;pointer-events:none}
.lobby-top{display:flex;align-items:center;gap:22px}
.lobby-name{font-family:var(--serif);font-style:italic;font-size:46px;font-weight:600;line-height:1}
.lobby-clock{margin-left:auto;font-family:var(--serif);font-size:56px;font-weight:600;color:#C79A4A;font-variant-numeric:tabular-nums}
.lobby-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:36px;margin-top:30px;flex:1;min-height:0}
.lobby h2{font-size:15px;letter-spacing:.32em;text-transform:uppercase;color:#C79A4A;margin-bottom:16px;font-weight:600}
.lchair{display:flex;align-items:center;gap:18px;padding:16px 20px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);margin-bottom:12px}
.lchair .who{font-family:var(--serif);font-size:30px;font-weight:600}
.lnext{display:flex;align-items:center;gap:18px;padding:12px 18px;border-bottom:1px solid rgba(255,255,255,.08);font-size:26px}
.lnext .pos{font-family:var(--serif);color:#C79A4A;font-size:34px;width:46px}
.lnext .eta{margin-left:auto;font-size:18px;color:#cbbfa9}
.lobby-foot{margin-top:18px;overflow:hidden;white-space:nowrap;border-top:1px solid rgba(255,255,255,.1);padding-top:14px;font-size:20px;color:#d8ccb6}
.marquee{display:inline-block;padding-left:100%;animation:marq 26s linear infinite}
@keyframes marq{to{transform:translateX(-100%)}}
.lobby-x{position:absolute;top:28px;left:50%;transform:translateX(-50%);z-index:3;opacity:.35}
.lobby-x:hover{opacity:1}

/* radar */
.radar{position:relative;width:100%;max-width:420px;aspect-ratio:1;margin:0 auto}
.radar svg{width:100%;height:100%;display:block}
.radar .sweep{transform-origin:200px 200px;animation:sweep 5s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
.radar .blip{cursor:pointer}
.radar .blip circle{transition:r .15s}
.radar .blip:hover circle.c{r:9}

/* loyalty */
.punch{border-radius:14px;padding:16px;background:var(--paper);border:1px solid var(--line);position:relative;overflow:hidden}
.punch::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:repeating-linear-gradient(-45deg,#C8352B 0 6px,#fff 6px 12px,#2C4A9A 12px 18px,#fff 18px 24px)}
.stamps{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;max-width:240px}
.stamp{width:38px;height:38px;flex:none;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center;font-size:16px;color:transparent}
.stamp.on{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);transform:rotate(-12deg)}
.stamp.free{border-style:solid;border-color:var(--brass);color:var(--brass);font-size:9px;font-weight:700;letter-spacing:.04em}
.ribbon{position:absolute;right:-34px;top:14px;transform:rotate(38deg);background:var(--brass);color:#fff;font-size:10px;font-weight:700;letter-spacing:.14em;padding:3px 40px}
.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(1.8) rotate(-30deg);opacity:0}100%{transform:scale(1) rotate(-12deg);opacity:1}}

/* cash-up rubber stamp */
.rubber{display:inline-block;border:3px solid var(--ok);color:var(--ok);font-weight:700;letter-spacing:.2em;padding:6px 14px;border-radius:8px;transform:rotate(-8deg);font-size:18px;opacity:.85}
.rubber.bad{border-color:var(--bad);color:var(--bad)}

/* heatmap */
.heat{display:grid;gap:3px;font-size:10.5px}
.heat .hc{height:26px;border-radius:5px;background:var(--accent);display:grid;place-items:center;color:var(--onAccent);font-size:10px}
.heat .hl{color:var(--muted);display:flex;align-items:center;justify-content:flex-end;padding-right:6px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper)}
.cal-h{padding:8px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--paper2);border-bottom:1px solid var(--line)}
.cal-d{min-height:96px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.cal-d:nth-child(7n){border-right:0}
.cal-d.other{background:var(--paper2);opacity:.6}
.cal-d.today .dn{background:var(--accent);color:var(--onAccent);border-radius:50%;width:24px;height:24px;display:grid;place-items:center}
.cal-d .dn{font-weight:600;font-size:12.5px;width:24px;height:24px;display:grid;place-items:center}
.cal-ev{font-size:11px;border-radius:5px;padding:2px 6px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* fade formula */
.formula{display:grid;grid-template-columns:240px 1fr;gap:20px;align-items:start}
.head svg{width:100%;height:auto;display:block}
.zone{cursor:pointer;transition:opacity .15s}
.zone:hover{opacity:.85}
.zone-row{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;cursor:pointer;border:1px solid transparent}
.zone-row:hover{background:var(--paper2)}
.zone-row.on{border-color:var(--brass);background:color-mix(in srgb,var(--brass) 10%,transparent)}
.zone-row .zv{margin-left:auto;font-family:var(--serif);font-weight:600;font-size:15px}
.guards{display:flex;flex-wrap:wrap;gap:6px}
.guard{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:5px 10px;cursor:pointer;font-weight:600;font-size:12.5px;min-width:40px}
.guard.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.recipe{font-family:var(--serif);font-size:15px;line-height:1.5;padding:12px 14px;border-radius:10px;background:var(--paper2);border:1px dashed var(--brass)}

/* clients */
.clist{max-height:calc(100vh - 230px);overflow-y:auto;margin:0 -8px;padding:0 8px}
.citem{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;cursor:pointer}
.citem:hover{background:var(--paper2)}
.citem.on{background:color-mix(in srgb,var(--brass) 14%,transparent)}
.alert-chip{background:color-mix(in srgb,var(--bad) 10%,transparent);color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 30%,transparent);border-radius:10px;padding:8px 12px;font-size:13px;display:flex;gap:8px;align-items:flex-start}

/* licence */
.lic{display:flex;gap:16px;align-items:center}
.count{width:82px;height:82px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;color:#fff}
.count b{font-family:var(--serif);font-size:28px;line-height:1}
.count span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.9}

/* schedule grid */
.sched{display:grid;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper)}
.sched > div{padding:10px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);font-size:12.5px;min-width:0}
.sched .sh{background:var(--paper2);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.shift{border-radius:8px;padding:6px 8px;cursor:pointer;font-weight:500;text-align:center}
.shift.off{color:var(--muted);background:repeating-linear-gradient(45deg,transparent 0 6px,var(--line2) 6px 8px)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(20,15,10,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:6vh 20px;overflow-y:auto;backdrop-filter:blur(2px)}
.modal{background:var(--paper);border-radius:18px;width:560px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--line);animation:mIn .18s ease}
.modal.wide{width:860px} .modal.xwide{width:1000px}
@keyframes mIn{from{transform:translateY(10px);opacity:0}}
.modal-h{padding:18px 22px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line2)}
.modal-h h3{font-family:var(--serif);font-size:20px}
.modal-b{padding:18px 22px}
.modal-f{padding:12px 22px 18px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line2)}
.svc-pick{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:220px;overflow-y:auto;padding:2px}
.svc-pick label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:7px 9px;cursor:pointer;font-size:12.5px}
.svc-pick label:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.svc-pick input{accent-color:var(--accent)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:12px;z-index:300;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:mIn .2s}
.menu{position:absolute;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.18);padding:6px;z-index:60;min-width:220px}
.menu button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px}
.menu button:hover{background:var(--paper2)}
.menu svg{width:16px;height:16px;stroke:currentColor}
.sres{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:9px;cursor:pointer}
.sres:hover,.sres.on{background:var(--paper2)}

/* welcome */
.welcome{position:fixed;inset:0;z-index:150;background:radial-gradient(circle at 30% 10%,#2c2721,#100e0c 75%);display:grid;place-items:center;padding:20px;color:#F3EBDD;overflow-y:auto}
.wbox{max-width:760px;width:100%;text-align:center;position:relative;padding:48px 40px;border:2px solid rgba(199,154,74,.5);border-radius:26px}
.wbox h1{font-family:var(--serif);font-style:italic;font-size:54px;font-weight:600;line-height:1.05}
.wbox .est{letter-spacing:.34em;text-transform:uppercase;color:#C79A4A;font-size:12px;font-weight:600}
.wopts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:30px;text-align:left}
.wopt{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);border-radius:16px;padding:20px;cursor:pointer;color:inherit;text-align:left}
.wopt:hover{border-color:#C79A4A;background:rgba(199,154,74,.08)}
.wopt b{font-family:var(--serif);font-size:20px;display:block;margin-bottom:6px}
.wopt span{font-size:13px;color:#cbbfa9}

/* help */
.help h3{font-family:var(--serif);font-size:18px;margin:4px 0 8px}
.help p,.help li{color:var(--ink);font-size:13.5px}
.help li{margin-bottom:5px}
.step{display:flex;gap:14px;margin-bottom:14px}
.step i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--side);color:var(--brass);display:grid;place-items:center;font-family:var(--serif);font-weight:600;flex:none}

/* printables */
.pv-wrap{background:repeating-linear-gradient(45deg,var(--paper2) 0 10px,var(--bg) 10px 20px);border-radius:14px;padding:26px;display:grid;place-items:center;border:1px solid var(--line)}
.pcard{background:#FFFBF2;color:#1F1B17;font-family:var(--sans);position:relative}
.gift{width:620px;aspect-ratio:2/1;border:10px solid #1D1B19;padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.gift-in{height:100%;border:1.5px solid #B8893B;display:grid;grid-template-columns:44px 1fr;}
.gift-pole{background:repeating-linear-gradient(-45deg,#C8352B 0 10px,#fff 10px 20px,#2C4A9A 20px 30px,#fff 30px 40px);border-right:1.5px solid #B8893B}
.gift-body{padding:20px 26px;display:flex;flex-direction:column}
.gift-t{font-size:12px;letter-spacing:.42em;text-transform:uppercase;color:#B8893B;font-weight:700}
.gift-shop{font-family:var(--serif);font-style:italic;font-size:30px;font-weight:600;line-height:1.1}
.gift-amt{font-family:var(--serif);font-size:54px;font-weight:600;line-height:1;margin-left:auto;color:#B23A2E}
.gift-line{display:flex;gap:8px;align-items:flex-end;font-size:12px;margin-top:8px}
.gift-line span{flex:none;letter-spacing:.14em;text-transform:uppercase;font-size:10px;font-weight:600;color:#6E6457}
.gift-line b{flex:1;border-bottom:1px solid #1F1B17;font-family:var(--serif);font-size:15px;font-weight:500;padding:0 4px 1px}
.board{width:560px;background:#1D1B19;color:#F3EBDD;padding:34px 38px;border-radius:6px;border:8px solid #6b4f2a;box-shadow:0 10px 30px rgba(0,0,0,.25),inset 0 0 0 2px #B8893B}

function bookRange() { let o = mins(S.settings.open), c = mins(S.settings.close); if (c <= o) c = o + 600; return [o, c]; }
function dayBook(d) {

  let times = ''; for (let m = o; m <= c; m += 60) times += `<div class="book-time" style="top:${(m - o) / 15 * RH}px">${fmtT(m)}</div>`;

}

function computeQueue() {
  const T = todayISO(); const now = nowMins(); const out = [];
  const bs = activeBarbers().filter(b => { const h = barberWorks(b, T); return h && !h.off && mins(h.e) > now; });
  const busy = {}; bs.forEach(b => busy[b.id] = apptsOn(T).filter(a => a.barberId === b.id && isLive(a) && a.status !== 'done').map(a => [mins(a.start), apptEnd(a)]).sort((x, y) => x[0] - y[0]));
  const freeAt = {}; bs.forEach(b => { const h = barberWorks(b, T); freeAt[b.id] = Math.max(now, mins(h.s)); });
  const fit = (bid, from, dur) => { let t = from; let moved = true; while (moved) { moved = false; for (const [s, e] of busy[bid]) if (t < e && t + dur > s) { t = e; moved = true; } } return t; };
  S.walkins.filter(w => w.status === 'waiting').sort(by(w => w.added)).forEach(w => {
    const dur = (serviceById(w.svc) || { dur: 30 }).dur; let best = null;
    bs.filter(b => !w.pref || b.id === w.pref).forEach(b => { const t = fit(b.id, freeAt[b.id], dur); if (!best || t < best.t) best = { b, t }; });
    if (best) { busy[best.b.id].push([best.t, best.t + dur]); out.push({ w, barber: best.b, start: best.t, wait: Math.max(0, Math.round(best.t - now)) }); }
    else out.push({ w, barber: null, start: null, wait: null });
  });
  return out;
}

function formulaSummary(f) {

  if (f.top && f.top !== '—') p.push('Top ' + g(f.top) + (f.topStyle ? ' (' + f.topStyle + ')' : ''));
  else if (f.topStyle) p.push(f.topStyle);
  if (f.sides && f.sides !== '—') p.push('Sides ' + g(f.sides));

  const sec = (t, arr, kind, emptyTxt) => `<div class="card"><div class="card-h"><div class="label">${t}</div><span class="chip">${arr.length}</span></div>${arr.length ? arr.slice(0, kind === 'booked' ? 8 : 40).map(x => row(x, kind)).join('') + (kind === 'booked' && arr.length > 8 ? `<div class="tiny muted" style="margin-top:6px">+ ${arr.length - 8} more</div>` : '') : `<div class="empty">${emptyTxt}</div>`}</div>`;
  return `<div class="grid g-1-2"><div class="grid" style="align-content:start"><div class="card"><div class="label" style="margin-bottom:6px">The radar</div>
   <div class="radar"><svg viewBox="0 0 400 400"><defs><radialGradient id="rg"><stop offset="0" stop-color="var(--accent)" stop-opacity=".1"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></radialGradient><linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--brass)" stop-opacity="0"/><stop offset="1" stop-color="var(--brass)" stop-opacity=".35"/></linearGradient></defs>
   <circle cx="200" cy="200" r="190" fill="var(--paper2)" stroke="var(--line)"/><circle cx="200" cy="200" r="190" fill="url(#rg)"/>
   <circle cx="200" cy="200" r="140" fill="none" stroke="var(--line)" stroke-dasharray="4 5"/><circle cx="200" cy="200" r="72" fill="color-mix(in srgb,var(--bad) 7%,transparent)" stroke="var(--bad)" stroke-opacity=".35" stroke-dasharray="4 5"/>
   <path d="M200 10V390M10 200H390" stroke="var(--line)" stroke-width="1"/>
   <g class="sweep"><path d="M200 200 L390 200 A190 190 0 0 0 334 66 Z" fill="url(#sw)"/></g>
   <text x="200" y="196" text-anchor="middle" style="font-size:11px;font-weight:700;letter-spacing:.14em;fill:var(--bad)">OVERDUE</text><text x="200" y="${200 - 72 - 6}" text-anchor="middle" style="font-size:10px;letter-spacing:.14em;fill:var(--muted)">THIS WEEK</text><text x="200" y="${200 - 140 - 6}" text-anchor="middle" style="font-size:10px;letter-spacing:.14em;fill:var(--muted)">NEXT WEEK</text>
   ${blips}</svg></div>
   <div class="legend" style="justify-content:center;margin-top:8px"><span><i class="dot" style="background:var(--bad)"></i>Overdue</span><span><i class="dot" style="background:var(--warn)"></i>Due this week</span><span><i class="dot" style="background:var(--accent2)"></i>Next week</span></div></div>
   <div class="card"><div class="label" style="margin-bottom:8px">Reminder text</div><div class="small" style="background:var(--paper2);padding:10px 12px;border-radius:10px">${esc(S.settings.reminder)}</div><div class="tiny muted" style="margin-top:8px">Click <b>Text</b> next to a name to copy this message with their details filled in, then paste it into your phone or messaging app. Edit the wording in Settings.</div></div>
   ${sec('Booked in', booked, 'booked', 'No upcoming bookings')}</div>
   <div class="grid" style="align-content:start">${sec('Overdue', over, 'over', 'Nobody overdue — great job!')}${sec('Due this week', week, 'week', 'No one due this week')}${sec('Due next week', soon, 'soon', 'Nothing coming up')}${sec('Haven’t seen in a while (6+ weeks overdue)', lost, 'lost', 'No lost clients')}</div></div>`;
};
ACT.copyRemind = d => { const c = clientById(d.id); copyText(S.settings.reminder.replace(/\{name\}/g, c.name.split(' ')[0]).replace(/\{shop\}/g, S.settings.shopName).replace(/\{barber\}/g, c.barberId ? bName(c.barberId).replace(/".*?"\s*/, '').split(' ')[0] : 'us')); };

/* ================= LOYALTY ================= */

  const list = S.clients.filter(c => !q || c.name.toLowerCase().includes(q)).sort(by(c => -(c.stamps || 0)));
  const ready = S.clients.filter(c => (c.stamps || 0) >= tgt).length; const close = S.clients.filter(c => (c.stamps || 0) >= tgt - 2 && (c.stamps || 0) < tgt).length;
  return `<div class="grid g4" style="margin-bottom:18px"><div class="card stat"><div class="label">Rewards ready</div><div class="v">${ready}</div><div class="d">Use at checkout</div></div><div class="card stat"><div class="label">Almost there</div><div class="v">${close}</div><div class="d">1–2 stamps away</div></div><div class="card stat"><div class="label">Rewards given</div><div class="v">${sum(S.clients, c => c.redeemed || 0)}</div><div class="d">All time</div></div><div class="card stat"><div class="label">The deal</div><div class="v" style="font-size:20px;margin-top:10px">Visit ${tgt} = ${esc(S.settings.loyaltyReward)}</div><div class="d"><a href="#" data-act="go" data-p="settings">Change in Settings</a></div></div></div>
  <div class="between" style="margin-bottom:14px"><input type="search" placeholder="Find a client’s card" style="max-width:280px" value="${esc(S.ui.lq || '')}" data-inp="lSearch" id="lq"><div class="row"><span class="small muted">A stamp is added automatically at every checkout.</span><button class="btn" data-act="goPrint" data-k="loyalty">${ico('print')}Print blank cards</button></div></div>
  <div class="grid g3">${list.map(c => `<div class="punch">${(c.stamps || 0) >= tgt ? '<div class="ribbon">REWARD</div>' : ''}<div class="between" style="padding-left:6px"><div><b style="cursor:pointer" data-act="openClient" data-id="${c.id}">${esc(c.name)}</b><div class="tiny muted">${c.redeemed || 0} reward${c.redeemed === 1 ? "" : "s"} used • ${esc(c.barberId ? bName(c.barberId).split(' ')[0] : '')}</div></div></div><div style="padding-left:6px">${punchHTML(c, tgt)}</div></div>`).join('') || '<div class="empty">No clients found</div>'}</div>`;
};
ACT.lSearch = (d, el) => { S.ui.lq = el.value; const p = el.selectionStart; render(); const n = $('#lq'); n.focus(); n.setSelectionRange(p, p); };

/* ================= DAILY CASH-UP ================= */
R.cashup = () => {
  const d = S.ui.cdate || todayISO(); const ap = apptsOn(d).filter(a => a.status === 'done' && a.pay); const sl = salesIn(d, d); const ex = expIn(d, d);
  const methods = [...new Set([...S.settings.payMethods, ...ap.map(a => a.pay.method), ...sl.map(s => s.method)])];
  const by_m = methods.map(m => ({ m, svc: sum(ap.filter(a => a.pay.method === m), a => a.pay.amount), tip: sum(ap.filter(a => a.pay.method === m), a => a.pay.tip), ret: sum(sl.filter(s => s.method === m), s => s.qty * s.price) })).filter(x => x.svc + x.tip + x.ret > 0 || S.settings.payMethods.includes(x.m));
  const svcT = sum(ap, a => a.pay.amount), tipT = sum(ap, a => a.pay.tip), retT = sum(sl, s => s.qty * s.price);
  const cashIn = sum(by_m.filter(x => x.m === 'Cash'), x => x.svc + x.tip + x.ret); const cashOut = sum(ex.filter(e => e.method === 'Cash'), e => e.amount);
  const cu = S.cashups[d] || { float: (S.cashups[addDays(d, -1)] || {}).float || 150, counted: '', notes: '', closed: false };
  const expected = (+cu.float || 0) + cashIn - cashOut; const diff = cu.counted === '' ? null : (+cu.counted) - expected;
  const perB = activeBarbers().map(b => { const x = ap.filter(a => a.barberId === b.id); return { b, n: x.length, svc: sum(x, a => a.pay.amount), tip: sum(x, a => a.pay.tip), cash: sum(x.filter(a => a.pay.method === 'Cash'), a => a.pay.tip) }; });
  return `<div class="between noprint" style="margin-bottom:16px"><div class="row"><button class="btn icon" data-act="cuNav" data-n="-1">${ico('left')}</button><input type="date" value="${d}" data-chg="cuDate" style="width:160px"><button class="btn icon" data-act="cuNav" data-n="1">${ico('right')}</button><button class="btn" data-act="cuToday">Today</button><h3 class="serif" style="font-size:20px;margin-left:8px">${fmtDL(d)}</h3></div><div class="row"><button class="btn" data-act="newSale">${ico('box')}Retail sale</button><button class="btn" data-act="newExpense">${ico('money')}Paid out</button></div></div>
  <div class="grid g4"><div class="card stat"><div class="label">Services</div><div class="v">${money2(svcT)}</div><div class="d">${ap.length} clients</div></div><div class="card stat"><div class="label">Retail</div><div class="v">${money2(retT)}</div><div class="d">${sum(sl, s => s.qty)} items</div></div><div class="card stat"><div class="label">Tips</div><div class="v">${money2(tipT)}</div><div class="d">For the barbers</div></div><div class="card stat"><div class="label">Total taken</div><div class="v">${money2(svcT + retT + tipT)}</div><div class="d">Everything in</div></div></div>
  <div class="grid g-2-1" style="margin-top:18px"><div class="grid" style="align-content:start">
   <div class="card"><div class="label" style="margin-bottom:10px">By payment type</div><table class="t"><tr><th>Method</th><th class="num">Services</th><th class="num">Tips</th><th class="num">Retail</th><th class="num">Total</th></tr>${by_m.map(x => `<tr><td><b>${esc(x.m)}</b></td><td class="num">${money2(x.svc)}</td><td class="num">${money2(x.tip)}</td><td class="num">${money2(x.ret)}</td><td class="num"><b>${money2(x.svc + x.tip + x.ret)}</b></td></tr>`).join('')}</table></div>
   <div class="card"><div class="label" style="margin-bottom:10px">By barber</div><table class="t"><tr><th>Barber</th><th class="num">Clients</th><th class="num">Services</th><th class="num">Tips</th><th class="num">Cash tips to pay out</th></tr>${perB.map(x => `<tr><td><span class="dot" style="background:${x.b.color}"></span> ${esc(x.b.name)}</td><td class="num">${x.n}</td><td class="num">${money2(x.svc)}</td><td class="num">${money2(x.tip)}</td><td class="num">${money2(x.cash)}</td></tr>`).join('')}</table></div>
   <div class="card"><div class="card-h"><div class="label">Every transaction</div><span class="small muted">${ap.length + sl.length + ex.length} lines</span></div>${ap.length + sl.length + ex.length ? `<table class="t"><tr><th>Time</th><th>What</th><th>Barber</th><th>Method</th><th class="num">Amount</th><th class="num">Tip</th></tr>${ap.sort(by(a => a.start)).map(a => `<tr class="click" data-act="openAppt" data-id="${a.id}"><td class="mono small">${fmtT(a.start)}</td><td>${esc(apptName(a))} <span class="muted small">• ${esc(apptSvcNames(a))}</span>${a.pay.disc ? ` <span class="chip acc">−${money2(a.pay.disc)}</span>` : ''}</td><td>${esc(bName(a.barberId).split(' ')[0])}</td><td>${esc(a.pay.method)}</td><td class="num">${money2(a.pay.amount)}</td><td class="num">${money2(a.pay.tip)}</td></tr>`).join('')}${sl.map(s => `<tr><td class="mono small">retail</td><td>${esc(s.name)} × ${s.qty}</td><td>${esc(bName(s.barberId).split(' ')[0])}</td><td>${esc(s.method)}</td><td class="num">${money2(s.qty * s.price)}</td><td class="num"><button class="btn xs ghost danger" data-act="delSale" data-id="${s.id}">${ico('trash').replace('<svg ', '<svg style="width:13px;height:13px" ')}</button></td></tr>`).join('')}${ex.map(e => `<tr><td class="mono small">paid out</td><td>${esc(e.desc || e.cat)}</td><td>—</td><td>${esc(e.method)}</td><td class="num" style="color:var(--bad)">−${money2(e.amount)}</td><td></td></tr>`).join('')}</table>` : '<div class="empty">No sales on this day yet</div>'}</div></div>
   <div class="card" style="align-self:start"><div class="label" style="margin-bottom:12px">Cash drawer</div>
    <div class="form" style="grid-template-columns:1fr">${fld('float', 'Opening float (cash in the drawer this morning)', 'number', cu.float, { min: 0, attr: 'data-inp="cuSet" data-k="float"' })}
    <div class="f"><span>Cash taken today (services + tips + retail)</span><div class="serif" style="font-size:20px;font-weight:600">${money2(cashIn)}</div></div>
    <div class="f"><span>Cash paid out today</span><div class="serif" style="font-size:20px;font-weight:600">−${money2(cashOut)}</div></div>
    <div class="divider"></div><div class="f"><span>Expected in the drawer</span><div class="serif" style="font-size:28px;font-weight:600">${money2(expected)}</div></div>
    ${fld('counted', 'Cash you counted', 'number', cu.counted, { min: 0, attr: 'data-chg="cuSet" data-k="counted"' })}
    ${fld('notes', 'Notes', 'text', cu.notes, { attr: 'data-chg="cuSet" data-k="notes"' })}</div>
    <div style="text-align:center;margin:18px 0 10px" id="cuRes">${diff == null ? '<span class="small muted">Count the drawer and type the total above.</span>' : Math.abs(diff) < .005 ? '<span class="rubber">BALANCED</span>' : `<span class="rubber bad">${diff > 0 ? 'OVER' : 'SHORT'} ${money2(Math.abs(diff))}</span>`}</div>
    <button class="btn ${cu.closed ? '' : 'pri'}" style="width:100%;justify-content:center" data-act="cuClose">${cu.closed ? ico('check') + 'Day closed — reopen' : ico('check') + 'Close the day'}</button>
    <div class="label" style="margin:20px 0 8px">Last 7 days</div>${[...Array(7)].map((_, i) => { const x = addDays(d, -i - 1); const c = S.cashups[x]; return `<div class="between small" style="padding:4px 0;cursor:pointer" data-act="cuGo" data-d="${x}"><span>${fmtDS(x)}</span>${c && c.closed ? '<span class="chip ok">Closed</span>' : '<span class="chip">Open</span>'}</div>`; }).join('')}</div></div>`;
};
ACT.cuNav = d => { S.ui.cdate = addDays(S.ui.cdate || todayISO(), +d.n); render(); };
ACT.cuToday = () => { S.ui.cdate = todayISO(); render(); };
ACT.cuGo = d => { S.ui.cdate = d.d; render(); };
ACT.cuDate = (d, el) => { if (el.value) { S.ui.cdate = el.value; render(); } };
function cuGet() { const d = S.ui.cdate || todayISO(); if (!S.cashups[d]) S.cashups[d] = { float: (S.cashups[addDays(d, -1)] || {}).float || 150, counted: '', notes: '', closed: false }; return S.cashups[d]; }
ACT.cuSet = (d, el, e) => { const c = cuGet(); c[d.k] = el.value; save(); if (e.type === 'change') render(); };
ACT.cuClose = () => { const c = cuGet(); c.closed = !c.closed; save(); render(); toast(c.closed ? 'Day closed. See you tomorrow!' : 'Day reopened'); };
ACT.newSale = () => {
  const retail = S.products.filter(p => p.type === 'Retail'); if (!retail.length) { toast('Add retail products first'); go('products'); return; }
  openModal('Retail sale', `<div class="form">${fld('productId', 'Product', 'select', retail[0].id, { options: retail.map(p => [p.id, p.name + ' — ' + money2(p.price) + ' (' + p.stock + ' left)']), full: true, attr: 'data-chg="saleP"' })}${fld('qty', 'Quantity', 'number', 1, { min: 1, step: 1 })}${fld('price', 'Price each', 'number', retail[0].price, { min: 0 })}${fld('method', 'Paid with', 'select', 'Card', { options: S.settings.payMethods })}${fld('barberId', 'Sold by', 'select', (activeBarbers()[0] || {}).id, { options: activeBarbers().map(b => [b.id, b.name]) })}${fld('date', 'Date', 'date', S.ui.page === 'cashup' ? (S.ui.cdate || todayISO()) : todayISO())}</div>`, { saveLabel: 'Record sale', onSave: v => { const p = productById(v.productId); const q = Math.max(1, +v.qty || 1); S.sales.push({ id: uid(), date: v.date, productId: p.id, name: p.name, qty: q, price: +v.price || 0, method: v.method, barberId: v.barberId }); p.stock = Math.max(0, p.stock - q); save(); render(); toast('Sale recorded — ' + p.stock + ' ' + p.name + ' left'); } });
};
ACT.saleP = (d, el) => { const p = productById(el.value); $('#ov [name=price]').value = p.price; };
ACT.delSale = d => confirmBox('Delete this retail sale? Stock will be added back.', () => { const s = S.sales.find(x => x.id === d.id); const p = productById(s.productId); if (p) p.stock += s.qty; S.sales = S.sales.filter(x => x.id !== d.id); save(); render(); });

/* ================= INCOME & EXPENSES ================= */
R.money = () => {
  const m = S.ui.month || todayISO().slice(0, 7) + '-01'; const [from, to] = monthRange(m);
  const ap = apptsDoneIn(from, to); const gross = sum(ap, a => a.pay.amount); const retail = sum(salesIn(from, to), s => s.qty * s.price); const rent = sum(rentIn(from, to), r => r.amount);
  const share = sum(ap, shopShare); const inc = share + retail + rent; const ex = expIn(from, to).sort(by(e => e.date, -1)); const exT = sum(ex, e => e.amount); const profit = inc - exT;
  const first = [...S.appts.map(a => a.date), ...S.expenses.map(e => e.date)].reduce((x, y) => y < x ? y : x, m); const span = clamp((parseISO(m).getFullYear() - parseISO(first).getFullYear()) * 12 + parseISO(m).getMonth() - parseISO(first).getMonth() + 1, 6, 12);
  const months = [...Array(span)].map((_, i) => { const mm = addMonths(m, i - span + 1); const [f, t] = monthRange(mm); return { m: mm, inc: shopIncome(f, t), ex: sum(expIn(f, t), e => e.amount) }; });
  const mx = Math.max(1, ...months.map(x => Math.max(x.inc, x.ex)));
  const W = 760, H = 220, pl = 48, bw = (W - pl - 10) / months.length;
  const yT = v => H - 26 - v / mx * (H - 46);
  const ticks = [0, .25, .5, .75, 1].map(t => `<line x1="${pl}" x2="${W}" y1="${yT(mx * t)}" y2="${yT(mx * t)}" stroke="var(--line2)"/><text x="${pl - 6}" y="${yT(mx * t) + 4}" text-anchor="end">${money(Math.round(mx * t))}</text>`).join('');
  const bars = months.map((x, i) => { const X = pl + i * bw + 6; const w = (bw - 14) / 2; return `<g><title>${MONL[parseISO(x.m).getMonth()]}: income ${money(x.inc)}, expenses ${money(x.ex)}, profit ${money(x.inc - x.ex)}</title><rect x="${X}" y="${yT(x.inc)}" width="${w}" height="${H - 26 - yT(x.inc)}" rx="3" fill="${x.m === m ? 'var(--accent)' : 'color-mix(in srgb,var(--accent) 55%,transparent)'}"/><rect x="${X + w + 2}" y="${yT(x.ex)}" width="${w}" height="${H - 26 - yT(x.ex)}" rx="3" fill="var(--brass)" opacity="${x.m === m ? 1 : .55}"/><text x="${X + w}" y="${H - 8}" text-anchor="middle" style="${x.m === m ? 'font-weight:700;fill:var(--ink)' : ''}">${MON[parseISO(x.m).getMonth()]}</text></g>`; }).join('');
  const line = months.map((x, i) => `${pl + i * bw + bw / 2},${yT(Math.max(0, x.inc - x.ex))}`).join(' ');
  const cats = {}; ex.forEach(e => cats[e.cat] = (cats[e.cat] || 0) + e.amount); const cmax = Math.max(1, ...Object.values(cats));
  return `<div class="between" style="margin-bottom:16px"><div class="row"><button class="btn icon" data-act="mNav" data-n="-1">${ico('left')}</button><h3 class="serif" style="font-size:22px;min-width:190px;text-align:center">${MONL[parseISO(m).getMonth()]} ${parseISO(m).getFullYear()}</h3><button class="btn icon" data-act="mNav" data-n="1">${ico('right')}</button></div><div class="row"><button class="btn" data-act="yearCSV">${ico('down')}Year summary (CSV)</button><button class="btn pri" data-act="newExpense">${ico('plus')}Add expense</button></div></div>
  <div class="grid g4"><div class="card stat"><div class="label">Gross takings</div><div class="v">${money(gross + retail)}</div><div class="d">All services + retail through the till</div></div><div class="card stat"><div class="label">Shop income</div><div class="v">${money(inc)}</div><div class="d">Shop’s share${S.settings.mode === 'team' ? ' + booth rent ' + money(rent) : ''} + retail</div></div><div class="card stat"><div class="label">Expenses</div><div class="v">${money(exT)}</div><div class="d">${ex.length} items</div></div><div class="card stat"><div class="label">Shop profit</div><div class="v" style="color:${profit >= 0 ? 'var(--ok)' : 'var(--bad)'}">${money(profit)}</div><div class="d">${m.slice(0, 7) === todayISO().slice(0, 7) ? 'Month to date' : inc ? Math.round(profit / inc * 100) + '% margin' : '—'}</div></div></div>
  <div class="card" style="margin-top:18px"><div class="card-h"><div class="label">Last ${months.length} months</div><div class="legend"><span><i class="dot" style="background:var(--accent)"></i>Shop income</span><span><i class="dot" style="background:var(--brass)"></i>Expenses</span><span><i class="dot" style="background:var(--ok)"></i>Profit</span></div></div>

/* ================= BOOTH RENT & PAY ================= */
function periodRange(k) { const T = todayISO(); if (k === 'lastweek') { const s = addDays(weekStartOf(T), -7); return [s, addDays(s, 6)]; } if (k === 'month') return monthRange(T); if (k === 'lastmonth') return monthRange(addMonths(T.slice(0, 7) + '-01', -1)); const s = weekStartOf(T); return [s, addDays(s, 6)]; }
function rentPeriod(b, d) { if (b.rentFreq === 'month') return monthRange(d); const s = weekStartOf(d); return [s, addDays(s, 6)]; }
function rentBalance(b, from, to) { const due = +b.rent || 0; const paid = sum(S.rentPays.filter(r => r.barberId === b.id && r.date >= from && r.date <= to), r => r.amount); return { due, paid, bal: Math.max(0, due - paid) }; }
R.pay = () => {
  const k = S.ui.payP || 'week'; const [from, to] = periodRange(k);
  const rows = S.barbers.filter(b => b.active !== false).map(b => { const ap = apptsDoneIn(from, to).filter(a => a.barberId === b.id); const svc = sum(ap, a => a.pay.amount), tip = sum(ap, a => a.pay.tip); const ret = sum(salesIn(from, to).filter(s => s.barberId === b.id), s => s.qty * s.price); return { b, n: ap.length, svc, tip, ret, shop: sum(ap, shopShare), earn: sum(ap, barberShare) + tip }; });
  const renters = S.barbers.filter(b => b.pay === 'booth' && b.active !== false);
  const cc = S.ui.calc || { sales: 1600, pct: 50, rent: 275 };
  const cEarn = cc.sales * cc.pct / 100, rEarn = cc.sales - cc.rent, be = cc.pct >= 100 ? 0 : cc.rent / (cc.pct / 100);
  return `<div class="between" style="margin-bottom:16px"><div class="seg">${[['week', 'This week'], ['lastweek', 'Last week'], ['month', 'This month'], ['lastmonth', 'Last month']].map(([v, t]) => `<button class="${k === v ? 'on' : ''}" data-act="payP" data-v="${v}">${t}</button>`).join('')}</div><div class="row"><span class="small muted">${fmtD(from)} – ${fmtD(to)}</span><button class="btn" data-act="payCSV">${ico('down')}Export CSV</button><button class="btn pri" data-act="newRent">${ico('plus')}Record booth rent</button></div></div>
  <div class="card"><div class="label" style="margin-bottom:10px">Pay sheet</div><table class="t"><tr><th>Barber</th><th>Set-up</th><th class="num">Clients</th><th class="num">Service sales</th><th class="num">Tips</th><th class="num">Retail sold</th><th class="num">Shop keeps</th><th class="num">Barber takes home</th></tr>
   ${rows.map(x => `<tr><td><span class="dot" style="background:${x.b.color}"></span> <b>${esc(x.b.name)}</b></td><td>${x.b.pay === 'owner' ? '<span class="chip">Owner</span>' : x.b.pay === 'commission' ? `<span class="chip blue">Commission ${x.b.commission}%</span>` : `<span class="chip acc">Booth rent ${money(x.b.rent)}/${x.b.rentFreq === 'month' ? 'mo' : 'wk'}</span>`}</td><td class="num">${x.n}</td><td class="num">${money2(x.svc)}</td><td class="num">${money2(x.tip)}</td><td class="num">${money2(x.ret)}</td><td class="num">${x.b.pay === 'owner' ? '—' : money2(x.shop)}</td><td class="num"><b>${x.b.pay === 'owner' ? '<span class="muted">owner</span>' : money2(x.earn)}</b></td></tr>`).join('')}
   <tr><td colspan="3"><b>Total</b></td><td class="num"><b>${money2(sum(rows, x => x.svc))}</b></td><td class="num"><b>${money2(sum(rows, x => x.tip))}</b></td><td class="num"><b>${money2(sum(rows, x => x.ret))}</b></td><td class="num"></td><td class="num"></td></tr></table>
   <p class="tiny muted" style="margin:10px 0 0">Commission barbers take home their % of service sales plus all their tips. Booth renters keep all their sales and tips and pay rent to the shop. Change each barber’s set-up in Settings.</p></div>
  <div class="grid g2" style="margin-top:18px"><div class="card"><div class="card-h"><div class="label">Booth rent</div></div>${renters.length ? renters.map(b => { const [f, t] = rentPeriod(b, todayISO()); const x = rentBalance(b, f, t); const hist = S.rentPays.filter(r => r.barberId === b.id).sort(by(r => r.date, -1)).slice(0, 6); return `<div style="margin-bottom:14px"><div class="between"><div><b>${esc(b.name)}</b><div class="tiny muted">${money(b.rent)} per ${b.rentFreq === 'month' ? 'month' : 'week'} • this ${b.rentFreq === 'month' ? 'month' : 'week'}: ${fmtD(f)} – ${fmtD(t)}</div></div>${x.bal > 0 ? `<span class="chip bad">${money(x.bal)} due</span>` : '<span class="chip ok">Paid up</span>'}</div><div class="bar" style="margin:8px 0"><i style="width:${x.due ? Math.min(100, x.paid / x.due * 100) : 100}%;background:var(--ok)"></i></div><div class="row"><button class="btn sm" data-act="newRent" data-b="${b.id}">Record payment</button></div>${hist.length ? `<table class="t" style="margin-top:8px">${hist.map(r => `<tr><td class="small">${fmtD(r.date)}</td><td class="small muted">${esc(r.note || '')}</td><td class="small">${esc(r.method)}</td><td class="num small"><b>${money2(r.amount)}</b></td><td class="num"><button class="btn xs ghost danger" data-act="delRent" data-id="${r.id}">${ico('trash').replace('<svg ', '<svg style="width:12px;height:12px" ')}</button></td></tr>`).join('')}</table>` : ''}</div>`; }).join('<div class="divider"></div>') : '<div class="empty">No booth renters. Set a barber to “Booth rent” in Settings to track rent here.</div>'}</div>
   <div class="card"><div class="label" style="margin-bottom:4px">Commission or booth rent?</div><h3 style="margin-bottom:12px">Quick calculator</h3>
    <div class="form" style="grid-template-columns:1fr 1fr 1fr">${fld('cs', 'Weekly service sales', 'number', cc.sales, { min: 0, attr: 'data-inp="calc" data-k="sales"' })}${fld('cp', 'Commission %', 'number', cc.pct, { min: 0, attr: 'data-inp="calc" data-k="pct"' })}${fld('cr', 'Booth rent / week', 'number', cc.rent, { min: 0, attr: 'data-inp="calc" data-k="rent"' })}</div>
    <div class="grid g2" style="margin-top:14px;gap:12px" id="calcOut">${calcOut(cEarn, rEarn, be, cc)}</div></div></div>`;
};
function calcOut(cEarn, rEarn, be, cc) { return `<div style="background:var(--paper2);border-radius:12px;padding:14px;${cEarn >= rEarn ? 'outline:2px solid var(--ok)' : ''}"><div class="tiny muted" style="letter-spacing:.14em;text-transform:uppercase;font-weight:600">On commission</div><div class="serif" style="font-size:26px;font-weight:600">${money(cEarn)}</div><div class="tiny muted">barber’s week (before tips)</div></div><div style="background:var(--paper2);border-radius:12px;padding:14px;${rEarn > cEarn ? 'outline:2px solid var(--ok)' : ''}"><div class="tiny muted" style="letter-spacing:.14em;text-transform:uppercase;font-weight:600">Renting a booth</div><div class="serif" style="font-size:26px;font-weight:600">${money(rEarn)}</div><div class="tiny muted">barber’s week (before tips & own costs)</div></div><div class="full small" style="grid-column:1/-1">Break-even: at <b>${cc.pct >= 100 ? '—' : money(Math.round(cc.rent / (1 - cc.pct / 100)))}</b> in weekly sales, both options pay the barber the same. Above that, renting pays the barber more; below it, commission does.</div>`; }

ACT.newRent = d => { const rs = S.barbers.filter(b => b.pay === 'booth'); if (!rs.length) { toast('No booth renters set up yet'); go('settings'); return; } const b = barberById(d && d.b) || rs[0]; openModal('Booth rent payment', `<div class="form">${fld('barberId', 'Barber', 'select', b.id, { options: rs.map(x => [x.id, x.name]) })}${fld('amount', 'Amount', 'number', b.rent, { min: 0 })}${fld('date', 'Date paid', 'date', todayISO())}${fld('method', 'Paid with', 'select', 'Cash', { options: [...new Set(['Cash', ...S.settings.payMethods, 'Bank transfer', 'Check'])] })}${fld('note', 'Note', 'text', (b.rentFreq === 'month' ? MONL[new Date().getMonth()] : 'Week of ' + fmtD(weekStartOf(todayISO()))), { full: true })}</div>`, { saveLabel: 'Save payment', onSave: v => { S.rentPays.push({ id: uid(), barberId: v.barberId, amount: +v.amount || 0, date: v.date, method: v.method, note: v.note }); save(); render(); toast('Rent payment saved'); } }); };

ACT.payCSV = () => { const [from, to] = periodRange(S.ui.payP || 'week'); const rows = [['Barber', 'Set-up', 'Clients', 'Service sales', 'Tips', 'Shop keeps', 'Barber takes home', 'From', 'To']]; S.barbers.forEach(b => { const ap = apptsDoneIn(from, to).filter(a => a.barberId === b.id); rows.push([b.name, b.pay === 'commission' ? 'Commission ' + b.commission + '%' : b.pay === 'booth' ? 'Booth rent' : 'Owner', ap.length, sum(ap, a => a.pay.amount).toFixed(2), sum(ap, a => a.pay.tip).toFixed(2), sum(ap, shopShare).toFixed(2), (sum(ap, barberShare) + sum(ap, a => a.pay.tip)).toFixed(2), from, to]); }); download('Pay-Sheet-' + from + '.csv', csv(rows), 'text/csv'); };

   <div class="grid" style="align-content:start"><div class="card"><div class="card-h"><div class="label">Shopping list</div>${low.length ? `<button class="btn sm" data-act="copyShop">${ico('copy')}Copy</button>` : ''}</div>${low.length ? low.map(p => `<div class="list-item"><span class="dot" style="background:var(--bad)"></span><div style="flex:1"><b class="small">${esc(p.name)}</b><div class="tiny muted">${p.stock} left • ${esc(p.supplier || 'no supplier')}</div></div><span class="chip">${p.type}</span></div>`).join('') : '<div class="empty">Everything is stocked</div>'}</div>
   <div class="card"><div class="card-h"><div class="label">Retail this month</div><b class="serif">${money(sum(ms, s => s.qty * s.price))}</b></div><div class="small muted" style="margin-bottom:8px">${sum(ms, s => s.qty)} items sold • best sellers (90 days):</div>${Object.entries(top).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([n, q]) => `<div class="hbar" style="grid-template-columns:130px 1fr 30px"><span class="small" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(n)}</span><div class="bar"><i style="width:${q / tmax * 100}%"></i></div><span class="small num">${q}</span></div>`).join('') || '<div class="empty">No sales yet</div>'}</div></div></div>`;
};

ACT.copyShop = () => copyText('Shopping list:\n' + S.products.filter(p => p.stock <= p.min).map(p => '- ' + p.name + ' (' + p.stock + ' left)' + (p.supplier ? ' — ' + p.supplier : '')).join('\n'));

  openModal(id ? 'Edit product' : 'Add product', `<div class="form">${fld('name', 'Product name', 'text', p.name, { full: true })}${fld('type', 'Type', 'select', p.type, { options: ['Retail', 'Back bar'] })}${fld('supplier', 'Supplier', 'text', p.supplier)}${fld('stock', 'In stock', 'number', p.stock, { min: 0, step: 1 })}${fld('min', 'Reorder when it drops to', 'number', p.min, { min: 0, step: 1 })}${fld('cost', 'Cost each', 'number', p.cost, { min: 0 })}${fld('price', 'Sale price (retail)', 'number', p.price, { min: 0 })}</div>`, { left: id ? `<button class="btn danger" data-act="delProd" data-id="${id}">${ico('trash')}Delete</button>` : '', onSave: v => { if (!v.name.trim()) { toast('Add a name'); return false; } Object.assign(p, { name: v.name.trim(), type: v.type, supplier: v.supplier, stock: Math.max(0, +v.stock || 0), min: Math.max(0, +v.min || 0), cost: +v.cost || 0, price: +v.price || 0 }); if (!id) S.products.push(Object.assign(p, { id: uid() })); save(); render(); toast('Product saved'); } });

/* ================= SANITATION ================= */
R.sanit = () => {
  const T = todayISO(); const log = S.taskLog[T] || []; const daily = S.tasks.filter(t => t.every === 1); const maint = S.tasks.filter(t => t.every > 1);
  const groups = [...new Set(daily.map(t => t.group))];
  const pct = daily.length ? Math.round(daily.filter(t => log.includes(t.id)).length / daily.length * 100) : 0;
  const days = [...Array(28)].map((_, i) => { const d = addDays(T, -27 + i); const l = S.taskLog[d] || []; const p = daily.length ? daily.filter(t => l.includes(t.id)).length / daily.length : 0; return { d, p }; });
  return `<div class="grid g-2-1"><div class="grid" style="align-content:start"><div class="card"><div class="card-h"><div><div class="label">Today • ${fmtDS(T)}</div><h3 style="margin-top:4px">Daily sanitation checklist</h3></div><div class="row"><div class="prog-ring" style="--p:${pct}"><span>${pct}%</span></div></div></div>
   <div class="grid g3" style="gap:16px">${groups.map(g => `<div><div class="label" style="margin-bottom:8px">${esc(g)}</div>${daily.filter(t => t.group === g).map(t => `<label class="check" style="padding:7px 0;border-bottom:1px solid var(--line2);align-items:flex-start"><input type="checkbox" data-chg="taskTick" data-id="${t.id}" ${log.includes(t.id) ? 'checked' : ''} style="margin-top:2px"><span style="${log.includes(t.id) ? 'text-decoration:line-through;color:var(--muted)' : ''}">${esc(t.name)}</span></label>`).join('')}</div>`).join('')}</div>
   <div class="row" style="margin-top:14px"><button class="btn sm" data-act="taskAll">${ico('check')}Tick all</button><button class="btn sm" data-act="editTask">${ico('plus')}Add task</button><button class="btn sm" data-act="printChecklist">${ico('print')}Print blank checklist</button></div></div>
   <div class="card"><div class="card-h"><div class="label">Tool care & deep cleans</div></div><table class="t"><tr><th>Task</th><th>How often</th><th>Last done</th><th>Next due</th><th></th></tr>${maint.sort(by(t => t.last ? diffDays(T, addDays(t.last, t.every)) : -999)).map(t => { const due = t.last ? addDays(t.last, t.every) : null; const dd = due ? diffDays(T, due) : null; return `<tr><td><b class="click" style="cursor:pointer" data-act="editTask" data-id="${t.id}">${esc(t.name)}</b></td><td class="small">Every ${t.every} days</td><td class="small">${t.last ? fmtD(t.last) : '<span class="muted">never</span>'}</td><td>${dd == null ? '<span class="chip warn">Not logged</span>' : dd < 0 ? `<span class="chip bad">${-dd}d overdue</span>` : dd <= 3 ? `<span class="chip warn">${dd ? 'in ' + dd + 'd' : 'today'}</span>` : `<span class="chip ok">${fmtD(due)}</span>`}</td><td class="num"><button class="btn xs dark" data-act="taskDone" data-id="${t.id}">Done today</button></td></tr>`; }).join('')}</table></div></div>
  <div class="grid" style="align-content:start"><div class="card"><div class="label" style="margin-bottom:10px">Last 4 weeks</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px">${days.map(x => `<div title="${fmtDS(x.d)}: ${Math.round(x.p * 100)}%" style="aspect-ratio:1;border-radius:6px;background:${x.p >= 1 ? 'var(--ok)' : x.p > 0 ? 'color-mix(in srgb,var(--ok) ' + Math.round(25 + x.p * 50) + '%,transparent)' : 'var(--line2)'};display:grid;place-items:center;font-size:10px;color:${x.p >= .6 ? '#fff' : 'var(--muted)'};${x.d === T ? 'outline:2px solid var(--ink)' : ''}">${parseISO(x.d).getDate()}</div>`).join('')}</div>
   <div class="small muted" style="margin-top:10px">${days.filter(x => x.p >= 1).length} of 28 days fully completed</div></div>
   <div class="card"><div class="label" style="margin-bottom:8px">Why it matters</div><p class="small" style="margin:0">Inspectors look for clean tools, a fresh disinfectant jar and a neck strip on every client. A daily log helps you show the shop is kept to standard. Check your own state board rules for exact requirements.</p></div></div></div>`;
};
ACT.taskTick = (d, el) => { const T = todayISO(); const l = S.taskLog[T] = S.taskLog[T] || []; if (el.checked) { if (!l.includes(d.id)) l.push(d.id); } else S.taskLog[T] = l.filter(x => x !== d.id); save(); render(); };
ACT.taskAll = () => { S.taskLog[todayISO()] = S.tasks.filter(t => t.every === 1).map(t => t.id); save(); render(); toast('All done — spotless!'); };
ACT.taskDone = d => { const t = S.tasks.find(x => x.id === d.id); t.last = todayISO(); save(); render(); toast('Logged: ' + t.name); };
ACT.editTask = d => { const id = d && d.id; const t = id ? S.tasks.find(x => x.id === id) : { name: '', group: 'Opening', every: 1 }; openModal(id ? 'Edit task' : 'Add task', `<div class="form">${fld('name', 'Task', 'text', t.name, { full: true })}${fld('every', 'How often', 'select', String(t.every), { options: [['1', 'Every day (checklist)'], ['2', 'Every 2 days'], ['7', 'Weekly'], ['14', 'Every 2 weeks'], ['30', 'Monthly'], ['60', 'Every 2 months'], ['90', 'Every 3 months'], ['180', 'Every 6 months']] })}${fld('group', 'Checklist group (daily tasks)', 'select', t.group, { options: ['Opening', 'All day', 'Closing', 'Maintenance'] })}</div>`, { left: id ? `<button class="btn danger" data-act="delTask" data-id="${id}">${ico('trash')}Delete</button>` : '', onSave: v => { if (!v.name.trim()) return false; Object.assign(t, { name: v.name.trim(), every: +v.every, group: +v.every === 1 && v.group === 'Maintenance' ? 'All day' : +v.every > 1 ? 'Maintenance' : v.group }); if (!id) S.tasks.push(Object.assign(t, { id: uid() })); save(); render(); } }); };
ACT.delTask = d => confirmBox('Delete this task?', () => { S.tasks = S.tasks.filter(t => t.id !== d.id); save(); render(); });
ACT.printChecklist = () => {
  const daily = S.tasks.filter(t => t.every === 1); const ws = weekStartOf(todayISO());
  const w = document.createElement('div'); w.id = 'printArea'; w.className = 'hide';
  w.innerHTML = `<div style="font-family:var(--sans);color:#000"><h2 style="font-family:var(--serif);font-size:22px">${esc(S.settings.shopName)} — Sanitation log</h2><p style="font-size:12px">Week of ____________ &nbsp;&nbsp; Initial each box when done.</p><table class="t" style="font-size:11.5px"><tr><th>Task</th>${[...Array(7)].map((_, i) => `<th style="text-align:center">${DOW[dow(addDays(ws, i))]}</th>`).join('')}</tr>${daily.map(t => `<tr><td>${esc(t.name)}</td>${[...Array(7)].map(() => '<td style="border:1px solid #bbb;width:52px"></td>').join('')}</tr>`).join('')}</table></div>`;
  const old = $('#printArea'); if (old) old.remove();
  $('#content').appendChild(w); document.body.classList.add('print-card'); doPrint();
};

/* ================= LICENCES ================= */
R.licences = () => {

  return `<div class="between" style="margin-bottom:16px"><span class="small muted">Licences, permits, insurance and continuing-education hours — with countdowns so nothing lapses.</span><button class="btn pri" data-act="editLic">${ico('plus')}Add licence or renewal</button></div>

};
ACT.editLic = d => { const id = d && d.id; const l = id ? S.licences.find(x => x.id === id) : { name: '', holder: S.settings.shopName, exp: addDays(todayISO(), 365), ceReq: 0, ceDone: 0, notes: '' }; openModal(id ? 'Edit licence' : 'Add licence or renewal', `<div class="form">${fld('name', 'What is it', 'text', l.name, { full: true, ph: 'e.g. Barber licence, shop licence, insurance' })}${fld('holder', 'Whose', 'text', l.holder)}${fld('exp', 'Expires / renews on', 'date', l.exp)}${fld('ceReq', 'CE hours required', 'number', l.ceReq, { min: 0 })}${fld('ceDone', 'CE hours done', 'number', l.ceDone, { min: 0 })}${fld('notes', 'Notes', 'text', l.notes, { full: true })}</div>`, { left: id ? `<button class="btn danger" data-act="delLic" data-id="${id}">${ico('trash')}Delete</button>` : '', onSave: v => { if (!v.name.trim()) return false; Object.assign(l, { name: v.name.trim(), holder: v.holder, exp: v.exp, ceReq: +v.ceReq || 0, ceDone: +v.ceDone || 0, notes: v.notes }); if (!id) S.licences.push(Object.assign(l, { id: uid() })); save(); render(); } }); };
ACT.renewLic = d => { const l = S.licences.find(x => x.id === d.id); const base = l.exp > todayISO() ? l.exp : todayISO(); const dt = parseISO(base); dt.setFullYear(dt.getFullYear() + 1); l.exp = iso(dt); if (l.ceReq) l.ceDone = 0; save(); render(); toast('Renewed until ' + fmtD(l.exp)); };
ACT.delLic = d => confirmBox('Delete this licence?', () => { S.licences = S.licences.filter(l => l.id !== d.id); save(); render(); });

/* ================= STAFF SCHEDULE ================= */
R.staff = () => {
  const ws = weekStartOf(S.ui.sdate || todayISO()); const days = [...Array(7)].map((_, i) => addDays(ws, i)); const bs = activeBarbers();
  const cells = bs.map(b => { let hrs = 0; const c = days.map(d => { const h = barberWorks(b, d); if (h && !h.off) hrs += (mins(h.e) - mins(h.s)) / 60; const n = apptsOn(d).filter(a => a.barberId === b.id && isLive(a)).length; return `<div>${!h ? `<div class="shift off" data-act="editHours" data-b="${b.id}" data-w="${dow(d)}">Off</div>` : h.off ? `<div class="shift" style="background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)" data-act="go" data-p="staff">${esc(h.reason || 'Time off')}</div>` : `<div class="shift" style="background:color-mix(in srgb,${b.color} 15%,transparent);color:${b.color}" data-act="editHours" data-b="${b.id}" data-w="${dow(d)}">${fmtT(h.s).replace(':00', '')}–${fmtT(h.e).replace(':00', '')}<div class="tiny" style="opacity:.75">${n} booked</div></div>`}</div>`; }).join(''); return `<div><b>${esc(b.name)}</b><div class="tiny muted">${hrs} hrs this week</div></div>${c}`; }).join('');
  return `<div class="between" style="margin-bottom:16px"><div class="row"><button class="btn icon" data-act="sNav" data-n="-7">${ico('left')}</button><h3 class="serif" style="font-size:20px">Week of ${fmtD(ws)}</h3><button class="btn icon" data-act="sNav" data-n="7">${ico('right')}</button><button class="btn" data-act="sToday">This week</button></div><button class="btn pri" data-act="editOff">${ico('plus')}Request time off</button></div>
  <div class="hscroll"><div class="sched" style="grid-template-columns:150px repeat(7,minmax(0,1fr))"><div class="sh">Barber</div>${days.map(d => `<div class="sh" style="${d === todayISO() ? 'color:var(--accent)' : ''}">${DOW[dow(d)]} ${parseISO(d).getDate()}</div>`).join('')}${cells}</div></div>
  <p class="small muted">Click a shift to change that barber’s regular hours for that weekday. The appointment book greys out hours when a barber isn’t working.</p>
  <div class="card" style="margin-top:18px"><div class="card-h"><div class="label">Time off</div></div>${S.timeoff.length ? `<table class="t"><tr><th>Barber</th><th>From</th><th>To</th><th>Reason</th><th>Status</th><th></th></tr>${S.timeoff.sort(by(t => t.from, -1)).map(t => `<tr><td><span class="dot" style="background:${bColor(t.barberId)}"></span> ${esc(bName(t.barberId))}</td><td>${fmtDS(t.from)}</td><td>${fmtDS(t.to)}</td><td>${esc(t.reason)}</td><td>${t.status === 'Approved' ? '<span class="chip ok">Approved</span>' : t.status === 'Declined' ? '<span class="chip bad">Declined</span>' : '<span class="chip warn">Pending</span>'}</td><td class="num"><button class="btn xs" data-act="editOff" data-id="${t.id}">Edit</button></td></tr>`).join('')}</table>` : '<div class="empty">No time off booked</div>'}</div>`;
};
ACT.sNav = d => { S.ui.sdate = addDays(S.ui.sdate || todayISO(), +d.n); render(); };
ACT.sToday = () => { S.ui.sdate = todayISO(); render(); };
ACT.editHours = d => { const b = barberById(d.b); b.hours = b.hours || DEFAULT_HOURS(); const h = b.hours[d.w]; openModal(esc(b.name) + ' — every ' + DOWL[d.w], `<div class="form"><label class="check full"><input type="checkbox" name="on" ${h.on ? 'checked' : ''}>Works on ${DOWL[d.w]}s</label>${fld('s', 'Starts', 'time', h.s)}${fld('e', 'Finishes', 'time', h.e)}</div>`, { onSave: v => { b.hours[d.w] = { on: v.on, s: v.s || '09:00', e: v.e || '18:00' }; save(); render(); } }); };
ACT.editOff = d => { const id = d && d.id; const t = id ? S.timeoff.find(x => x.id === id) : { barberId: (activeBarbers()[0] || {}).id, from: todayISO(), to: todayISO(), reason: 'Vacation', status: 'Approved' }; openModal(id ? 'Edit time off' : 'Time off', `<div class="form">${fld('barberId', 'Barber', 'select', t.barberId, { options: S.barbers.map(b => [b.id, b.name]) })}${fld('status', 'Status', 'select', t.status, { options: ['Approved', 'Pending', 'Declined'] })}${fld('from', 'From', 'date', t.from)}${fld('to', 'To', 'date', t.to)}${fld('reason', 'Reason', 'text', t.reason, { full: true })}</div>`, { left: id ? `<button class="btn danger" data-act="delOff" data-id="${id}">${ico('trash')}Delete</button>` : '', onSave: v => { if (v.to < v.from) { toast('End date is before start date'); return false; } Object.assign(t, v); if (!id) S.timeoff.push(Object.assign(t, { id: uid() })); const clash = S.appts.filter(a => a.barberId === t.barberId && a.date >= t.from && a.date <= t.to && (a.status === 'booked' || a.status === 'arrived')).length; save(); render(); toast(clash ? '⚠ ' + clash + ' appointments are booked in these days — move them in the book' : 'Time off saved'); } }); };

/* ================= PROMO PLANNER ================= */
const PROMO_COL = { 'Promo': 'var(--accent)', 'Social post': 'var(--accent2)', 'Event': 'var(--brass)', 'Holiday hours': '#4E8A5E' };
const IDEAS = [['Back-to-school kids cuts', 'Promo'], ['Prom & homecoming fresh cuts', 'Promo'], ['Graduation day line-ups', 'Promo'], ['Father’s Day: dad + kid combo', 'Promo'], ['Holiday gift certificates', 'Promo'], ['New Year fresh start special', 'Promo'], ['Fade of the week (before & after)', 'Social post'], ['Meet the barber', 'Social post'], ['Client spotlight (ask first)', 'Social post'], ['Behind the chair: tool clean-up', 'Social post'], ['Product of the month', 'Social post'], ['Customer appreciation day', 'Event'], ['Free kids cuts charity day', 'Event'], ['Extended holiday hours', 'Holiday hours']];
R.promo = () => {
  const m = S.ui.pmonth || todayISO().slice(0, 7) + '-01'; const first = parseISO(m); const ws = S.settings.weekStart === 'sun' ? 0 : 1;
  const start = addDays(m, -((first.getDay() - ws + 7) % 7)); const T = todayISO();
  const cells = [...Array(42)].map((_, i) => { const d = addDays(start, i); const ev = S.promos.filter(p => d >= p.date && d <= (p.end || p.date)); return `<div class="cal-d ${d.slice(0, 7) !== m.slice(0, 7) ? 'other' : ''} ${d === T ? 'today' : ''}" data-act="editPromo" data-d="${d}"><span class="dn">${parseISO(d).getDate()}</span>${ev.slice(0, 3).map(p => `<div class="cal-ev" style="background:${PROMO_COL[p.type] || 'var(--muted)'}" data-act="editPromo" data-id="${p.id}">${esc(p.title)}</div>`).join('')}${ev.length > 3 ? `<div class="tiny muted">+${ev.length - 3} more</div>` : ''}</div>`; }).join('');
  const up = S.promos.filter(p => (p.end || p.date) >= T).sort(by(p => p.date)).slice(0, 8);
  return `<div class="grid g-2-1"><div><div class="between" style="margin-bottom:12px"><div class="row"><button class="btn icon" data-act="pmNav" data-n="-1">${ico('left')}</button><h3 class="serif" style="font-size:22px;min-width:190px;text-align:center">${MONL[first.getMonth()]} ${first.getFullYear()}</h3><button class="btn icon" data-act="pmNav" data-n="1">${ico('right')}</button></div><div class="row"><div class="legend">${Object.entries(PROMO_COL).map(([k, c]) => `<span><i class="dot" style="background:${c}"></i>${k}</span>`).join('')}</div><button class="btn pri" data-act="newPromo">${ico('plus')}Add</button></div></div>
   <div class="cal">${[...Array(7)].map((_, i) => `<div class="cal-h">${DOW[(i + ws) % 7]}</div>`).join('')}${cells}</div>
