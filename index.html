/* ================= STATS ================= */
R.stats = () => {
  const days = +(S.ui.stP || 90); const T = todayISO(); const from = addDays(T, -days + 1);
  const all = S.appts.filter(a => a.date >= from && a.date <= T && !(a.date === T && a.status === 'booked'));
  const done = all.filter(a => a.status === 'done' && a.pay); const ns = all.filter(a => a.status === 'noshow').length; const booked = all.filter(a => a.status !== 'cancelled').length;
  const rev = sum(done, a => a.pay.amount); const tips = sum(done, a => a.pay.tip);
  const cids = [...new Set(done.filter(a => a.clientId).map(a => a.clientId))];
  const newC = S.clients.filter(c => { const f = S.appts.filter(a => a.clientId === c.id && a.status === 'done').sort(by(a => a.date))[0]; return f && f.date >= from; }).length;
  const rebooked = cids.filter(id => { const c = clientById(id); if (!c) return false; const r = rebookInfo(c); return r.state === 'booked' || r.state === 'fine' || r.state === 'soon' || r.state === 'week'; }).length;
  const heat = {}; let hmax = 1; const [o, cl] = bookRange(); const hours = []; for (let h = Math.floor(o / 60); h < Math.ceil(cl / 60); h++) hours.push(h);
  done.forEach(a => { const k = dow(a.date) + '-' + Math.floor(mins(a.start) / 60); heat[k] = (heat[k] || 0) + 1; hmax = Math.max(hmax, heat[k]); });
  const order = S.settings.weekStart === 'sun' ? [0, 1, 2, 3, 4, 5, 6] : [1, 2, 3, 4, 5, 6, 0];
  const svcC = {}; done.forEach(a => a.svcs.forEach(id => { svcC[id] = svcC[id] || { n: 0, v: 0 }; svcC[id].n++; })); done.forEach(a => { const id = a.svcs[0]; if (id && svcC[id]) svcC[id].v += a.pay.amount; });
  const sv = Object.entries(svcC).sort((a, b) => b[1].n - a[1].n).slice(0, 8); const smax = Math.max(1, ...sv.map(x => x[1].n));
  const pm = {}; done.forEach(a => pm[a.pay.method] = (pm[a.pay.method] || 0) + a.pay.amount + a.pay.tip); const pmT = sum(Object.values(pm)) || 1;
  const byB = activeBarbers().map(b => { const x = done.filter(a => a.barberId === b.id); return { b, n: x.length, v: sum(x, a => a.pay.amount), t: sum(x, a => a.pay.tip) }; }); const bmax = Math.max(1, ...byB.map(x => x.v));
  const dayTot = {}; done.forEach(a => dayTot[dow(a.date)] = (dayTot[dow(a.date)] || 0) + a.pay.amount); const best = Object.entries(dayTot).sort((a, b) => b[1] - a[1])[0];
  let ang = 0; const pie = Object.entries(pm).map(([k, v], i) => { const a0 = ang; ang += v / pmT * 360; return `${['var(--accent)', 'var(--accent2)', 'var(--brass)', '#4E8A5E', '#7A5A9A'][i % 5]} ${a0}deg ${ang}deg`; }).join(',');
  return `<div class="between" style="margin-bottom:16px"><div class="seg">${[[30, 'Last 30 days'], [90, 'Last 90 days'], [180, '6 months'], [365, '12 months']].map(([v, t]) => `<button class="${days === v ? 'on' : ''}" data-act="stP" data-v="${v}">${t}</button>`).join('')}</div><span class="small muted">${fmtD(from)} – ${fmtD(T)}</span></div>
  <div class="grid g4"><div class="card stat"><div class="label">Clients served</div><div class="v">${done.length}</div><div class="d">${cids.length} different regulars • ${newC} new</div></div><div class="card stat"><div class="label">Average ticket</div><div class="v">${done.length ? money(rev / done.length, 2) : '—'}</div><div class="d">+ ${done.length ? money(tips / done.length, 2) : '—'} avg tip</div></div><div class="card stat"><div class="label">Rebook rate</div><div class="v">${cids.length ? Math.round(rebooked / cids.length * 100) : 0}%</div><div class="d">Regulars booked or still on schedule</div></div><div class="card stat"><div class="label">No-show rate</div><div class="v" style="color:${booked && ns / booked > .08 ? 'var(--bad)' : 'inherit'}">${booked ? (ns / booked * 100).toFixed(1) : 0}%</div><div class="d">${ns} no-shows</div></div></div>
  <div class="grid g-2-1" style="margin-top:18px"><div class="card"><div class="card-h"><div class="label">Busiest hours</div><span class="small muted">${best ? 'Busiest day: <b>' + DOWL[best[0]] + '</b>' : ''}</span></div>
   <div class="hscroll"><div class="heat" style="grid-template-columns:44px repeat(${hours.length},1fr)"><div></div>${hours.map(h => `<div class="tiny muted" style="text-align:center">${S.settings.timeFmt === '24' ? h : ((h % 12) || 12) + (h < 12 ? 'a' : 'p')}</div>`).join('')}${order.map(d => `<div class="hl">${DOW[d]}</div>${hours.map(h => { const v = heat[d + '-' + h] || 0; return `<div class="hc" style="opacity:${v ? .15 + v / hmax * .85 : .06}" title="${DOWL[d]} ${fmtT(h * 60)}: ${v} clients">${v || ''}</div>`; }).join('')}`).join('')}</div></div>
   <p class="tiny muted" style="margin-bottom:0">Use the quiet hours for promos or walk-in specials, and add help on the busy ones.</p></div>
   <div class="card"><div class="label" style="margin-bottom:14px">How clients pay</div><div class="row" style="gap:18px;flex-wrap:nowrap"><div style="width:120px;height:120px;border-radius:50%;background:conic-gradient(${pie || 'var(--line2) 0 360deg'});flex:none;position:relative"><div style="position:absolute;inset:26px;border-radius:50%;background:var(--paper)"></div></div><div>${Object.entries(pm).map(([k, v], i) => `<div class="small" style="margin:4px 0"><i class="dot" style="background:${['var(--accent)', 'var(--accent2)', 'var(--brass)', '#4E8A5E', '#7A5A9A'][i % 5]}"></i> ${esc(k)} <b>${Math.round(v / pmT * 100)}%</b></div>`).join('')}</div></div></div></div>
  <div class="grid g2" style="margin-top:18px"><div class="card"><div class="label" style="margin-bottom:10px">Top services</div>${sv.map(([id, x]) => `<div class="hbar"><span class="small" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc((serviceById(id) || { name: 'Removed' }).name)}</span><div class="bar"><i style="width:${x.n / smax * 100}%;background:${(serviceById(id) || {}).color || 'var(--accent)'}"></i></div><span class="small num" style="text-align:right">${x.n}</span></div>`).join('') || '<div class="empty">No data yet</div>'}</div>
   <div class="card"><div class="label" style="margin-bottom:10px">By barber</div>${byB.map(x => `<div class="hbar" style="grid-template-columns:130px 1fr 150px"><span class="small"><i class="dot" style="background:${x.b.color}"></i> ${esc(x.b.name.split(' ')[0])}</span><div class="bar"><i style="width:${x.v / bmax * 100}%;background:${x.b.color}"></i></div><span class="small num" style="text-align:right">${money(x.v)} • ${x.n} cuts</span></div>`).join('')}</div></div>`;
};

  } else if (k === 'loyalty') {

  } else {

  }
  return `<div class="noprint"><div class="seg" style="margin-bottom:16px">${tabs.map(([v, t]) => `<button class="${k === v ? 'on' : ''}" data-act="prK" data-v="${v}">${t}</button>`).join('')}</div></div>

   <div class="card"><div class="label" style="margin-bottom:12px">Lists you can edit</div><div class="form">${catBox('serviceCats', 'Service categories')}${catBox('expenseCats', 'Expense categories')}${catBox('payMethods', 'Payment methods')}${catBox('clientTags', 'Client tags')}${catBox('promoTypes', 'Promo planner types')}</div></div>
   <div class="card"><div class="label" style="margin-bottom:6px">Backup & data</div><p class="small muted" style="margin-top:0">Your planner is saved in this browser on this device. Export a backup every week and keep it somewhere safe (a cloud folder, email or USB stick). Use Import backup to move it to another device.</p>
    <div class="row"><button class="btn pri" data-act="exportJSON">${ico('down')}Export backup</button><label class="btn">${ico('up')}Import backup<input type="file" accept=".json,application/json" hidden data-chg="importJSON"></label></div>
    <div class="label" style="margin:16px 0 8px">Export to spreadsheet (CSV)</div><div class="row">${[['clients', 'Clients'], ['appts', 'Appointments'], ['sales', 'Retail sales'], ['expenses', 'Expenses']].map(([k, t]) => `<button class="btn sm" data-act="exportCSV" data-k="${k}">${t}</button>`).join('')}<button class="btn sm" data-act="yearCSV">Year summary</button></div>
    <div class="divider"></div><div class="row">${S.demo ? `<button class="btn danger" data-act="eraseDemo">${ico('trash')}Erase demo content</button>` : ''}<button class="btn danger" data-act="resetAll">Start over (erase everything)</button></div></div>
  </div></div>`;
};
ACT.setS = (d, el) => { let v = el.value; if (el.type === 'number') v = +v || 0; if (d.k === 'loyaltyTarget') v = clamp(Math.round(v), 2, 20); S.settings[d.k] = v; save(); render(); };
ACT.setTheme = d => { S.settings.theme = d.v; save(); render(); };
ACT.setDark = (d, el) => { S.settings.dark = el.checked; save(); render(); };
ACT.catDel = d => { const a = S.settings[d.k]; if (a.length <= 1) { toast('Keep at least one'); return; } a.splice(+d.i, 1); save(); render(); };
ACT.catAdd = (d, el) => { const v = el.value.trim(); if (v && !S.settings[d.k].includes(v)) { S.settings[d.k].push(v); save(); render(); } };
ACT.editBarber = d => {
  const id = d && d.id; const b = id ? barberById(id) : { name: '', color: BARBER_COLORS[S.barbers.length % BARBER_COLORS.length], pay: S.barbers.length ? 'commission' : 'owner', commission: 50, rent: 250, rentFreq: 'week', phone: '', hours: DEFAULT_HOURS(), active: true };
  openModal(id ? 'Edit barber' : 'Add barber', `<div class="form">${fld('name', 'Name', 'text', b.name)}${fld('phone', 'Phone', 'tel', b.phone)}${fld('color', 'Colour in the book', 'color', b.color)}${fld('pay', 'Pay set-up', 'select', b.pay, { options: [['owner', 'Owner (shop keeps everything)'], ['commission', 'Commission (barber gets a %)'], ['booth', 'Booth rent (barber pays rent)']] })}${fld('commission', 'Barber’s commission %', 'number', b.commission, { min: 0 })}${fld('rent', 'Booth rent amount', 'number', b.rent, { min: 0 })}${fld('rentFreq', 'Rent is paid', 'select', b.rentFreq, { options: [['week', 'Weekly'], ['month', 'Monthly']] })}<label class="check"><input type="checkbox" name="active" ${b.active !== false ? 'checked' : ''}>Active (shows in the book)</label>
   <div class="f full"><span>Regular working days & hours</span><div class="grid hours-grid" style="grid-template-columns:repeat(7,1fr);gap:6px">${[1, 2, 3, 4, 5, 6, 0].map(i => `<div style="border:1px solid var(--line);border-radius:9px;padding:6px"><label class="check small"><input type="checkbox" name="on${i}" ${b.hours[i].on ? 'checked' : ''}>${DOW[i]}</label><input type="time" name="s${i}" value="${b.hours[i].s}" style="padding:3px 4px;font-size:11px;margin-top:4px"><input type="time" name="e${i}" value="${b.hours[i].e}" style="padding:3px 4px;font-size:11px;margin-top:3px"></div>`).join('')}</div></div></div>`, {
    size: 'wide', left: id ? `<button class="btn danger" data-act="delBarber" data-id="${id}">${ico('trash')}Remove</button>` : '', onSave: v => {
      if (!v.name.trim()) { toast('Add a name'); return false; } const hours = {}; for (let i = 0; i < 7; i++) hours[i] = { on: v['on' + i], s: v['s' + i] || '09:00', e: v['e' + i] || '18:00' };
      Object.assign(b, { name: v.name.trim(), phone: v.phone, color: v.color, pay: v.pay, commission: +v.commission || 0, rent: +v.rent || 0, rentFreq: v.rentFreq, active: v.active, hours }); if (!id) S.barbers.push(Object.assign(b, { id: uid() })); save(); render(); toast('Barber saved');
    }
  });
};
ACT.delBarber = d => { const used = S.appts.some(a => a.barberId === d.id); confirmBox(used ? 'This barber has appointments in your records, so they will be marked <b>inactive</b> instead of removed.' : 'Remove this barber?', () => { if (used) barberById(d.id).active = false; else S.barbers = S.barbers.filter(b => b.id !== d.id); save(); render(); }, used ? 'Mark inactive' : 'Remove'); };
ACT.exportJSON = () => { download('ChairLedger-backup-' + todayISO() + '.json', JSON.stringify(S, null, 1), 'application/json'); S.lastBackup = todayISO(); save(); toast('Backup downloaded — keep it somewhere safe'); };
ACT.importJSON = (d, el) => { const f = el.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { const o = JSON.parse(r.result); if (!o || !o.settings || !Array.isArray(o.appts)) throw 0; confirmBox('Replace everything in this planner with the backup from <b>' + esc(f.name) + '</b>?', () => { S = migrate(o); save(); render(); toast('Backup restored'); }, 'Restore backup'); } catch (e) { toast('That file isn’t a Chair & Ledger backup'); } }; r.readAsText(f); el.value = ''; };
ACT.exportCSV = d => {
  let rows;
  if (d.k === 'clients') rows = [['Name', 'Phone', 'Email', 'Birthday', 'Preferred barber', 'Every (weeks)', 'Last visit', 'Visits', 'Total spent', 'Stamps', 'Fade formula', 'Heads-up', 'Notes', 'Tags'], ...S.clients.map(c => [c.name, c.phone, c.email, c.birthday, c.barberId ? bName(c.barberId) : '', c.every, lastVisit(c.id) || '', S.appts.filter(a => a.clientId === c.id && a.status === 'done').length, clientSpend(c.id).toFixed(2), c.stamps, formulaSummary(c.formula), c.sens, c.notes, (c.tags || []).join('; ')])];
  else if (d.k === 'appts') rows = [['Date', 'Start', 'Minutes', 'Client', 'Barber', 'Services', 'Price', 'Status', 'Paid', 'Tip', 'Method', 'Discount', 'Notes'], ...S.appts.slice().sort(by(a => a.date + a.start)).map(a => [a.date, a.start, a.dur, apptName(a), bName(a.barberId), apptSvcNames(a), a.price, a.status, a.pay ? a.pay.amount : '', a.pay ? a.pay.tip : '', a.pay ? a.pay.method : '', a.pay ? a.pay.disc : '', a.notes])];
  else if (d.k === 'sales') rows = [['Date', 'Product', 'Qty', 'Price each', 'Total', 'Method', 'Sold by'], ...S.sales.map(s => [s.date, s.name, s.qty, s.price, (s.qty * s.price).toFixed(2), s.method, bName(s.barberId)])];
  else rows = [['Date', 'Category', 'Description', 'Amount', 'Paid with'], ...S.expenses.map(e => [e.date, e.cat, e.desc, e.amount, e.method])];
  download('ChairLedger-' + d.k + '-' + todayISO() + '.csv', csv(rows), 'text/csv'); toast('CSV downloaded');
};
ACT.eraseDemo = () => confirmBox('Erase all the demo clients, appointments and money records? Your settings stay. You’ll start with an empty planner plus a ready-made service menu and sanitation checklist.', () => { const keep = S.settings; S = freshState(); S.settings = Object.assign(keep, { shopName: 'My Barber Shop', owner: '', phone: '', address: '', since: String(new Date().getFullYear()) }); S.barbers = [{ id: uid(), name: 'Me', color: BARBER_COLORS[0], pay: 'owner', commission: 0, rent: 0, rentFreq: 'week', phone: '', hours: DEFAULT_HOURS(), active: true }]; save(); go('settings'); toast('Demo erased — add your shop name and barbers'); }, 'Erase demo');
ACT.resetAll = () => confirmBox('Erase <b>everything</b> and start again from the welcome screen? Export a backup first if you might need it.', () => { localStorage.removeItem(KEY); S = freshState(); welcome(); }, 'Erase everything');

 <div class="card"><div class="label">Start here</div><h3>Getting set up in 5 minutes</h3>

 <div class="card"><div class="label">Signature features</div><h3>What makes it different</h3><ul>
  <li><b>Fade Formula:</b> open a client, press <b>Edit formula</b>, tap each zone on the head and choose the guard. Next visit, any barber can repeat the cut exactly.</li>
  <li><b>Rebook Radar:</b> shows who’s due or overdue based on how often they usually come. Press <b>Text</b> to copy a ready-made reminder message.</li>

 <div class="grid" style="align-content:start">
 <div class="card"><div class="label">Devices</div><h3>Where it works</h3><p><b>Laptop & desktop</b> (Windows, Mac, Chromebook): open the HTML file in Chrome, Edge, Safari or Firefox, or use the web app link from your PDF guide.</p><p><b>Phone & tablet</b> (iPhone, iPad, Android): open the web app link in Safari or Chrome and add it to your Home Screen. It opens like an app and works offline after the first visit.</p><p>Each device keeps its own copy. They don’t sync automatically — move your planner with <b>Export backup</b> and <b>Import backup</b>. Clients can’t book themselves online; this is the shop’s own planner.</p></div>
 <div class="card"><div class="label">Your data</div><h3>Saving and backups</h3><ul><li>Everything saves automatically in <b>this browser on this device</b>. Nothing is uploaded anywhere.</li><li>Use the <b>same browser</b> each time. Chrome and Edge each keep their own copy.</li><li>Clearing your browser history/site data can erase the planner. <b>Export a backup weekly.</b></li><li>To move to another device: Export backup → send the file to the other device (email, AirDrop, cloud drive) → open the planner there → Import backup.</li><li>On iPhone and iPad, add the web app to your Home Screen so Safari keeps your data safe.</li><li>CSV exports open in Excel, Numbers or Google Sheets.</li></ul></div>
 <div class="card"><div class="label">Shortcuts</div><h3>Handy tricks</h3><ul><li><span class="kbd">Ctrl</span> + <span class="kbd">K</span> (or <span class="kbd">⌘</span> + <span class="kbd">K</span> on Mac) — search anything</li><li><span class="kbd">Esc</span> — close a window or the lobby screen</li><li>The <b>printer icon</b> prints any page. In the print window, turn on “Background graphics”.</li><li><b>Printables</b> has gift certificates, a price board, loyalty cards and next-cut cards.</li></ul></div>
 <div class="card"><div class="label">Troubleshooting</div><h3>If something looks wrong</h3><ul><li><b>Empty planner?</b> You may be in a different browser, or the browser data was cleared. Import your latest backup.</li><li><b>Can’t save?</b> Make sure you aren’t in a private/incognito window.</li><li><b>Print does nothing?</b> Open the planner directly in Chrome, Edge, Safari or Firefox (not inside an email, Etsy or file-preview window). On iPhone, open the link in Safari to print.</li><li><b>Colours missing on paper?</b> Turn on \u201cBackground graphics\u201d in the print window.</li><li><b>Need help?</b> Message me on Etsy and I’ll be happy to help.</li></ul></div></div></div>`;

function welcome() {
  document.body.className = ''; const w = document.createElement('div'); w.className = 'welcome'; w.id = 'welcome';
  w.innerHTML = `<div class="wbox"><div class="row" style="justify-content:center;gap:18px;margin-bottom:18px"><div class="pole big"></div></div><div class="est">The barber shop planner</div><h1>Chair & Ledger</h1><p style="color:#cbbfa9;max-width:520px;margin:12px auto 0">Bookings, walk-ins, fade formulas, rebook reminders, tips, booth rent and the daily cash-up — all in one place. Works offline in your browser.</p>
   <div class="wopts"><button class="wopt" data-act="wDemo"><b>Explore with demo content</b><span>See a busy 3-chair shop with clients, bookings and money already filled in. Erase it with one click when you’re ready.</span></button><button class="wopt" data-act="wFresh"><b>Start fresh</b><span>Open an empty planner with a starter service menu and sanitation checklist, ready for your shop.</span></button></div>
   <div id="wForm" class="hide" style="margin-top:22px;text-align:left"><div class="form" style="grid-template-columns:1fr 1fr 1fr"><label class="f"><span style="color:#cbbfa9">Shop name</span><input id="wShop" type="text" placeholder="e.g. Main Street Barbers"></label><label class="f"><span style="color:#cbbfa9">Your first name</span><input id="wOwner" type="text"></label><label class="f"><span style="color:#cbbfa9">Set-up</span><select id="wMode"><option value="team">Shop with a team</option><option value="solo">Solo barber</option></select></label></div><button class="btn pri" style="margin-top:14px;width:100%;justify-content:center" data-act="wGo">Open my planner</button></div>
   <p style="font-size:11.5px;color:#8f846f;margin-top:22px">Laptop, desktop, phone & tablet • Your data stays on your device</p></div>`;
  document.body.appendChild(w);
}
ACT.wDemo = () => { S = demoState(); save(); $('#welcome').remove(); render(); toast('Welcome to the demo shop! Erase the demo anytime in Settings.'); };
ACT.wFresh = () => { $('#wForm').classList.remove('hide'); $('#wShop').focus(); };
ACT.wGo = () => { S = freshState(); S.settings.shopName = $('#wShop').value.trim() || 'My Barber Shop'; S.settings.owner = $('#wOwner').value.trim(); S.settings.mode = $('#wMode').value; S.barbers = [{ id: uid(), name: S.settings.owner || 'Me', color: BARBER_COLORS[0], pay: 'owner', commission: 0, rent: 0, rentFreq: 'week', phone: '', hours: DEFAULT_HOURS(), active: true }]; save(); $('#welcome').remove(); render(); toast('Your planner is ready. Add your team in Settings.'); };

(function boot() {
  S = load();
  if (!S) { welcome(); return; }
  S.ui.date = todayISO(); S.ui.cdate = todayISO();
  render();
  try { if (/^https?:/.test(location.protocol) && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { }); } catch (e) { }
  setInterval(() => { if (!$('#ov') && !$('#lobby') && ['dash', 'queue', 'book'].includes(S.ui.page) && !document.activeElement.matches('input,select,textarea')) render(); }, 60000);
})();
</script><script>if('serviceWorker' in navigator && /^https?:/.test(location.protocol)) window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});</script></body></html>
